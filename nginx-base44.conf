server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sem cache durante o desenvolvimento — o preview sempre reflete as edições
    location / {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(jpg|jpeg|png|webp|svg|mp4|ico)$ {
        expires 7d;
    }
}
